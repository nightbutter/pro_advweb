<main class="customer-register-layout">
  <section class="customer-register-card">
    <a class="back-link" routerLink="/login">
      <lucide-icon [img]="icons.chevronRight" [size]="16" class="back-arrow"></lucide-icon>
      กลับไปเข้าสู่ระบบ
    </a>

    <header class="register-heading">
      <span class="register-icon"><lucide-icon [img]="icons.user" [size]="23"></lucide-icon></span>
      <div>
        <h1>สมัครสมาชิก</h1>
        <p>กรอกข้อมูลติดต่อและสร้างบัญชีลูกค้า</p>
      </div>
    </header>

    <form (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="name">ชื่อ-นามสกุล</label>
        <input id="name" name="name" type="text" autocomplete="name" [(ngModel)]="name" maxlength="100" required />
      </div>
      <div class="form-group">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" [(ngModel)]="phone"
          placeholder="เช่น 081-234-5678" required />
      </div>
      <div class="form-group">
        <label for="address">ที่อยู่</label>
        <textarea id="address" name="address" autocomplete="street-address" [(ngModel)]="address"
          maxlength="300" rows="3" placeholder="บ้านเลขที่ หอพัก และพื้นที่" required></textarea>
        <span class="field-hint">ตอนนี้เก็บที่อยู่ก่อน ยังไม่ต้องระบุพิกัดแผนที่</span>
      </div>
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้</label>
        <input id="username" name="username" type="text" autocomplete="username" [(ngModel)]="username"
          minlength="3" maxlength="24" placeholder="ตัวอักษร a-z และตัวเลข" required />
        <span class="field-hint">3–24 ตัวอักษร ใช้ a-z, 0-9, จุด, ขีดกลาง หรือขีดล่าง</span>
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input id="password" name="password" type="password" autocomplete="new-password" [(ngModel)]="password"
          minlength="8" maxlength="128" required />
        <span class="field-hint">อย่างน้อย 8 ตัวอักษร</span>
      </div>
      <div class="form-group">
        <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
          [(ngModel)]="confirmPassword" required />
      </div>

      <div *ngIf="errorMessage" class="alert alert-error" role="alert">
        <lucide-icon [img]="icons.alert" [size]="18"></lucide-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="loading">
        {{ loading ? 'กำลังสมัครสมาชิก…' : 'สมัครสมาชิก' }}
      </button>
    </form>
  </section>
</main>
